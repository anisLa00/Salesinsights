# Render Blueprint — provisions the API, PostgreSQL, and Redis together.
# Deploy: Render Dashboard → New → Blueprint → connect this repo → Apply.
# Docs will be live at https://<your-service>.onrender.com/api/v1/docs
services:
  - type: web
    name: salesinsights
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    # Apply migrations (Alembic owns the schema), seed demo data on first
    # boot (idempotent), then start the API.
    startCommand: alembic upgrade head && (python -m src.seed || echo "seed skipped") && uvicorn src:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: salesinsights-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: salesinsights-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Optional: paste your Anthropic key in the dashboard to enable real AI.
      # Left blank, the app returns the built-in heuristic analysis.
      - key: ANTHROPIC_API_KEY
        sync: false

  # Redis (Render "Key Value") — token blocklist + Celery broker/backend.
  - type: keyvalue
    name: salesinsights-redis
    plan: free
    region: oregon
    ipAllowList: []          # internal access only
    maxmemoryPolicy: allkeys-lru

databases:
  - name: salesinsights-db
    plan: free
    region: oregon
